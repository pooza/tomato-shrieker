---
# config 全体（application.yaml 等）用スキーマ。Ginseng::Config#errors（rake config:lint）が使用する。
# 個々のソース定義のスキーマは source.yaml を正本とし、SourceValidator /
# `shrieker source validate` で検証する。
# （json-schema gem は YAML ファイルへの $ref を解決できないため、ここでは source.yaml を
#  参照せず、ソース定義の重複も持たない。config/sources/* は merged_raw に含まれないため
#  本スキーマでの sources 検証は実質発火しない。）
$schema: http://json-schema.org/draft-06/schema#
title: Local config
type: object
definitions:
  source_default:
    type: object
    additionalProperties: false
    properties:
      monitor:
        type: object
        additionalProperties: false
        properties:
          tolerance:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                pattern: '^((\d+(\.\d+)?[smhdwMy])+|\d+(\.\d+)?)$'
          silence_tolerance:
            oneOf:
              - type: integer
                minimum: 1
              - type: string
                pattern: '^((\d+(\.\d+)?[smhdwMy])+|\d+(\.\d+)?)$'
          error_streak_threshold:
            type: integer
            minimum: 1
      schedule:
        type: object
        additionalProperties: false
        properties:
          retry:
            type: object
            additionalProperties: false
            properties:
              times:
                type: integer
                minimum: 1
                maximum: 10
              interval:
                oneOf:
                  - type: integer
                    minimum: 1
                  - type: string
                    pattern: '^(?=.*[1-9])((\d+(\.\d+)?[smhdwMy])+|\d+(\.\d+)?)$'
properties:
  crypt:
    type: object
    properties:
      password:
        type: string
    required:
      - password
  disable:
    type: boolean
  environment:
    enum:
      - development
      - production
  source_defaults:
    # ソース種別ごとの既定値 (#1559)。キーはクラス名。解決の規則は SourceDefaults
    type: object
    additionalProperties: false
    properties:
      CommandSource:
        $ref: '#/definitions/source_default'
      FeedSource:
        $ref: '#/definitions/source_default'
      GitHubRepositorySource:
        $ref: '#/definitions/source_default'
      GoogleNewsSource:
        $ref: '#/definitions/source_default'
      IcalendarSource:
        $ref: '#/definitions/source_default'
      TextSource:
        $ref: '#/definitions/source_default'
      YouTubeChannelSource:
        $ref: '#/definitions/source_default'
  monitor:
    type: object
    properties:
      enabled:
        type: boolean
      bind:
        type: string
      port:
        type: integer
        minimum: 1
        maximum: 65535
      default_tolerance_seconds:
        type: integer
        minimum: 1
      retention_days:
        type: integer
        minimum: 1
      error_streak_threshold:
        type: integer
        minimum: 1
      sample_size:
        type: integer
        minimum: 1
  ruby:
    type: object
    properties:
      jit:
        # CommandSource の子プロセスに RUBY_YJIT_ENABLE=yes を渡すか (#1614)
        type: boolean
  feed:
    type: object
    properties:
      default_tags:
        type: array
        items:
          type: string
  sources:
    type: array
    items:
      type: object
