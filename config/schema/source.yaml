---
# 単一ソース定義（config/sources/<id>.yaml）用スキーマ。
# 1 ファイル = 1 ソース。ファイル名が id になるため、ファイル内に id は持たない。
# base.yaml はこの定義を $ref で参照する。
$schema: http://json-schema.org/draft-06/schema#
title: Source definition
type: object
additionalProperties: false
required:
  - source
  - dest
# 有効なソースは配信先を 1 つ以上持たなければならない (#1473)。
# dest: {} は validate を通るのに配信が永久に起きず、run は no-op success を
# 積むだけなので健全に見えてしまう。
# ⚠ disable: true の死蔵定義（chinachu / epgstation / konomitv / mirakurun）は
# 実際に dest: {} なので、無効なソースは免除する。
anyOf:
  - required:
      - disable
    properties:
      disable:
        enum:
          - true
  - properties:
      dest:
        anyOf:
          - required:
              - hooks
          - required:
              - mastodon
          - required:
              - misskey
          - required:
              - line
          - required:
              - piefed
          - required:
              - nostr
properties:
  disable:
    type: boolean
  test:
    type: boolean
  enclosure:
    type: object
    additionalProperties: false
    properties:
      enable:
        type: boolean
      negative_keyword:
        type: string
  monitor:
    type: object
    additionalProperties: false
    properties:
      tolerance:
        # 実行遅延の猶予。数値（秒）または Rufus::Scheduler 形式の文字列（例: "10m"）
        type:
          - integer
          - string
      silence_tolerance:
        # 無配信の許容期間。未指定ならサイレント不発を検知しない（例: "90d"）
        # cron 形式の書き間違いを弾くため、文字列は Rufus の duration 形式に限る
        oneOf:
          - type: integer
            minimum: 1
          - type: string
            pattern: '^((\d+(\.\d+)?[smhdwMy])+|\d+(\.\d+)?)$'
  keep:
    type: object
    additionalProperties: false
    properties:
      years:
        type: integer
        minimum: 0
  schedule:
    type: object
    additionalProperties: false
    properties:
      at:
        type: string
      cron:
        type: string
      every:
        type: string
      remind:
        type: object
        additionalProperties: false
        properties:
          enable:
            type: boolean
          minutes:
            type: integer
  source:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      feed:
        type: string
        format: uri
      url:
        type: string
        format: uri
      calendar:
        type: string
        format: uri
      ical:
        type: string
        format: uri
      google:
        type: boolean
      text:
        type: string
      keyword:
        type: string
      negative_keyword:
        type: string
      days:
        type: integer
      delimiter:
        type: string
      dir:
        type: string
      command:
        # 配列（argv）または文字列（CommandSource が sh -c で実行）
        type:
          - array
          - string
        items:
          type: string
      env:
        type: object
        additionalProperties:
          type: string
      github:
        type: object
        additionalProperties: false
        properties:
          repository:
            type: string
          repos:
            type: string
          timeline:
            enum:
              - releases
              - commits
      news:
        type: object
        additionalProperties: false
        properties:
          url:
            type: string
            format: uri
          phrase:
            type: string
          dedupe:
            type: boolean
          cleaner:
            type: object
            additionalProperties: false
            properties:
              url:
                type: string
                format: uri
      youtube:
        type: object
        additionalProperties: false
        properties:
          channel:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              url:
                type: string
                format: uri
  dest:
    type: object
    additionalProperties: false
    properties:
      template:
        type: string
      sanitize:
        enum:
          - fedi
          - html
      tags:
        type: array
        items:
          type: string
      visibility:
        type: string
      prefix:
        type: string
      spoiler_text:
        type: string
      category:
        type: string
      account:
        type: object
        additionalProperties: false
        properties:
          bot:
            type: boolean
      hooks:
        type: array
        # hooks: [] は「宛先を書いたつもりで宛先ゼロ」になる (#1473)
        minItems: 1
        items:
          oneOf:
            - type: string
              format: uri
            - type: object
              additionalProperties: false
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                # 宛先の種別 (#1493)。省略すると Slack 互換の素の Webhook 扱い。
                # ⚠ room_id の有無のような暗黙判定はしないので、Tsunagal 宛は
                # 明示すること。書かないと CW (spoiler_text) が黙って落ちる。
                type:
                  type: string
                  enum:
                    - tsunagal
                channel:
                  type: string
                room_id:
                  type: string
      mastodon:
        type: object
        additionalProperties: false
        required:
          - url
          - token
        properties:
          url:
            type: string
            format: uri
          token:
            type: string
      misskey:
        type: object
        additionalProperties: false
        required:
          - url
          - token
        properties:
          url:
            type: string
            format: uri
          token:
            type: string
      line:
        type: object
        additionalProperties: false
        required:
          - user_id
          - token
        properties:
          user_id:
            type: string
          token:
            type: string
      piefed:
        type: object
        additionalProperties: false
        required:
          - host
          - user_id
          - password
          - community_id
        properties:
          host:
            type: string
          user_id:
            type: string
          password:
            type: string
          community_id:
            type: integer
          template:
            type: string
      nostr:
        type: object
        additionalProperties: false
        required:
          - private_key
        properties:
          private_key:
            type: string
          relays:
            type: array
            items:
              type: string
      mulukhiya:
        type: object
        additionalProperties: false
        required:
          - enable
        properties:
          enable:
            type: boolean
          url:
            type: string
            format: uri
          tagging:
            type: object
            additionalProperties: false
            properties:
              enable:
                type: boolean
