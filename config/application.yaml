crypt:
  encoder: base64
  password: null
environment: development
feed:
  default_tags: []
github:
  urls:
    root: https://github.com
google:
  api:
    key: null
  news:
    cleaner:
      url: null
    urls:
      root: https://news.google.com/rss/search?hl=ja&gl=JP&ceid=JP%3Aja
http:
  retry:
    limit: 3
    seconds: 1
  # ⚠ ginseng-core 1.19.0 の HTTP#initialize が必須で読む (`/http/timeout/seconds`)。
  # 既定へ倒れないので、無いと HTTP を作った時点で ConfigError になる。
  timeout:
    seconds: 30
line:
  urls:
    api: https://api.line.me
monitor:
  enabled: true
  bind: 127.0.0.1
  port: 4567
  default_tolerance_seconds: 7200
  retention_days: 14
  error_streak_threshold: 1
  sample_size: 50
logger:
  mask_fields:
    - password
    - secret
    - auth
  # ⚠ URL の**パス**が資格情報になっている宛先 (pooza/ginseng-core#580)。
  # モロヘイヤの webhook は POST /mulukhiya/webhook/{digest} で、digest を知って
  # いれば誰でもそのアカウントで投稿できる。接頭辞の次の 1 セグメントを落とす。
  #
  # ⚠ ginseng-core の既定にも同じ値が入っているので、ここは「本アプリが何を
  # 秘密とみなしているか」を明示するためのもの。既定に頼らず書いておく。
  mask_url_paths:
    - /mulukhiya/webhook/
package:
  authors:
    - Tatsuya Koishi
  description: 投稿のソース・投稿先・スケジュールの3要素を組み合わせた、単純なつぶやきボットを作成するツール。複数のボットが管理できる。
  email:
    - tkoishi@b-shock.co.jp
  license: MIT
  url: https://github.com/pooza/tomato-shrieker
  version: 4.8.0
nostr:
  relays:
    - wss://relay.damus.io
    - wss://nos.lol
    - wss://relay.nostr.band
piefed:
  subject:
    max_length: 50
  verify_peer: true
scheduler: {}
sentry:
  dsn: null
  traces_sample_rate: 0
slack:
  hooks: []
source:
  classes:
    - class: FeedSource
      config: /source/feed
    - class: FeedSource
      config: /source/url
    - class: CommandSource
      config: /source/command
    - class: TextSource
      config: /source/text
    - class: GoogleNewsSource
      config: /source/news/url
    - class: GoogleNewsSource
      config: /source/news/phrase
    - class: GitHubRepositorySource
      config: /source/github/repository
    - class: GitHubRepositorySource
      config: /source/github/repos
    - class: IcalendarSource
      config: /source/calendar
    - class: IcalendarSource
      config: /source/ical
    - class: YouTubeChannelSource
      config: /source/youtube/channel/id
    - class: YouTubeChannelSource
      config: /source/youtube/channel/url
sources: []
sqlite3:
  db: db.sqlite3
youtube:
  urls:
    root: https://www.youtube.com
    feed: https://www.youtube.com/feeds/videos.xml
